name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver=$(sed -n 's/^version=//p' module/module.prop)
          if [ "$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::module.prop version ($ver) != tag ($GITHUB_REF_NAME)"
            exit 1
          fi
          grep -q "\"version\": \"$ver\"" update.json || { echo "::error::update.json version != $ver"; exit 1; }

      - name: Vet po0req
        working-directory: module/src/po0req
        run: go vet ./...

      - name: Pack
        run: sh pack.sh

      - name: Extract changelog
        run: |
          ver=$(sed -n 's/^version=//p' module/module.prop)
          awk -v h="## $ver" '$0==h {f=1; next} /^## / && f {exit} f' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "$ver" > dist/notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: po0fw
          path: dist/po0fw-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/po0fw-*.zip
          body_path: dist/notes.md
