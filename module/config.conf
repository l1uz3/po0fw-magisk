# po0fw 配置 —— 改完保存即可，守护进程 1 分钟内自动生效（无需重启）
# 也可以在管理器里打开本模块的 WebUI 填 token

# 加白接口：把「你的token」换成自己的。可以写多行 URL= 同时加白多个。
URL="https://124.221.69.228/api/firewall/pgnfw_你的token/add"

# 定时兜底间隔（秒）：捕捉 Wi-Fi 没断但公网 IP 变了、蜂窝静默换 IP 等情况
INTERVAL=600

# 网络变化后，等网络安静多少秒再加白（等 DHCP / 路由稳定）
SETTLE=3

# 1 = 绑定当前物理网卡直连：绕过代理 / VPN，加白的是本机真实公网 IP（推荐）
# 0 = 走系统默认路由：开着 VPN 时可能加白成代理出口 IP
BIND_IFACE=1

# 手动指定网卡；留空 = 自动识别系统当前默认网络（推荐）
IFACE=""

# 证书：默认按系统 CA 校验。若服务端是自签证书，先在 WebUI 点「证书信息」查看，
# 再设 INSECURE=1 并把显示的 PIN 填到 PIN=（锁定公钥，比单纯跳过校验安全）
INSECURE=0
PIN=""

# 单次请求超时（秒）
TIMEOUT=10

# ---------- 以下一般不用改 ----------
# 请求方法
METHOD=POST
# 4 = 只走 IPv4（白名单一般按 IPv4）；6 = 只走 IPv6；留空 = 自动
IPV=4
# 仅当 URL 写的是域名时使用：解析用的 DNS（同样经物理网卡直连查询，避开代理 fake-ip）
DNS="223.5.5.5 119.29.29.29"
# 可选：响应体必须匹配这个正则才算成功，例如 '"ok": *true'；留空 = 只看 HTTP 2xx
OK_REGEX=""
# 1 = 日志里记录每个网络事件（排查问题用）
DEBUG=0
